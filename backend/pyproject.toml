[project]
name = "satalite-backend"
version = "0.1.0"
description = "SatAlite backend - concrete curing from hyperlocal air temperature"
requires-python = "==3.12.*"
dependencies = [
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.32.0",
    "pydantic~=2.9.0",
    "pydantic-settings~=2.6.0",
    "numpy~=2.1.0",
    "scipy~=1.14.0",
    "requests~=2.32.0",
    "python-dotenv~=1.0.0",
]

[dependency-groups]
dev = [
    "pytest~=8.3.0",
    "ruff~=0.7.0",
    "mypy~=1.13.0",
    "httpx~=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "physics", "vendor"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

# physics is the part that must be trusted. strict there, lenient everywhere else.
[[tool.mypy.overrides]]
module = "physics.*"
strict = true

[[tool.mypy.overrides]]
module = "vendor.*"
ignore_errors = true
